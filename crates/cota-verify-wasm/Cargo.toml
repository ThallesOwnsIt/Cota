[package]
name = "cota-verify-wasm"
version = "0.3.0"
edition.workspace = true
license.workspace = true
description = "Cota's v3 ledger verifier for the browser: the cota-ledger rules compiled to WebAssembly, with a tiny memory interface (no generated glue)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cota-ledger = { path = "../cota-ledger" }
borsh.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.154"
bs58 = "0.5.1"
