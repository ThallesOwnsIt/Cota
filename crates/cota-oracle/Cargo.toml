[package]
name = "cota-oracle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = ["solana-v4"] }
anyhow = "1.0.104"
base64 = "0.23.1"
bincode = "1.3"
bs58 = "0.5.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
cota = { version = "0.1.0", path = "../../programs/cota", features = ["no-entrypoint"] }
cota-core = { version = "0.1.0", path = "../cota-core" }
cota-ingest = { version = "0.1.0", path = "../cota-ingest" }
cota-quality = { version = "0.1.0", path = "../cota-quality" }
ed25519-dalek = "2"
hex.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.154"
sha2.workspace = true
solana-hash = "4"
solana-instructions-sysvar = "4.0"
solana-keypair = "3.1.2"
solana-message = "4.2"
solana-sdk-ids = "3.1"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1", features = ["serde", "wincode"] }

[dev-dependencies]
litesvm = { version = "0.18.1", features = ["precompiles"] }
