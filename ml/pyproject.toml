[project]
name = "cota-ml"
version = "0.1.0"
description = "Qualidade de dados e previsão quantílica (P10/P50/P90) do Cota"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.6",
    "numpy>=2.0",
    "polars>=1.20",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
