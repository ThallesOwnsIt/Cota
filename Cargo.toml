[workspace]
resolver = "2"
members = ["crates/*", "programs/*"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.89.0"

[workspace.dependencies]
borsh = { version = "1.5", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# O programa on-chain paga aluguel por byte: otimizar para tamanho.
[profile.release.package.cota]
opt-level = "z"
