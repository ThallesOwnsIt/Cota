# Places Cota watches: one reference gauge (config/stations-live.toml) per place, with its official levels where
# they exist. Levels are in metres on the gauge's own scale; each gauge has its own zero, so levels of different
# gauges are never compared.
#
# Only levels from an official document (`confirmed = true`: SGB, Defesa Civil) turn into "normal / attention /
# alert / flood" on the dashboard. The others show the level and its change only ("cota em confirmação") until an
# official source is found. Every level carries its source and the date it was checked.
#
# scripts/check_locations.py checks this file:
# - every gauge exists in the catalog;
# - the levels are in order;
# - confirmed levels have a source;
# - the recent median level is below the lowest level. A level copied from another gauge's scale shows up here.
#
# Changes go through review like code: a wrong level means a wrong alert.

[[location]]
id = "porto-alegre-cais-maua"
name = "Porto Alegre (Cais Mauá)"
river = "Guaíba"
gauge = "ANA-87450004"
alert_m = 2.60
flood_m = 3.00
record_m = 5.37              # 05/05/2024, SGB's revised figure (study of Sep 2024)
confirmed = true
source = "SGB, boletim SACE Guaíba de 30/07/2026"
source_url = "https://www.sgb.gov.br/sace/boletins/Guaiba/20260730_12-20260730%20-%20122755.pdf"
checked = "2026-11-12"

[[location]]
id = "porto-alegre-gasometro"
name = "Porto Alegre (Usina do Gasômetro)"
river = "Guaíba"
gauge = "ANA-87450020"
confirmed = false
# A 2025 report gives 3.60 m as the flood level here, but this gauge reads ~0.4 m below Cais Mauá: 3.60 m here
# would be ~4.0 m at Cais Mauá, against the official 3.00 m. Left out until the SGB confirms it.
note = "cota de 3,60 m de reportagem descartada: não bate com o zero desta régua"
checked = "2026-11-12"

