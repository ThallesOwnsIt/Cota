# --- Open-Meteo Flood API (GloFAS): modelled daily discharge (m³/s) -------------
# Coordinates = cell centre returned by the API, chosen as the cell with the
# largest discharge within a ±0.1° neighbourhood (the ~5 km cell may fall outside the river).
[[station]]
id = "GLOFAS-GUAIBA"
name = "Guaíba em Porto Alegre (GloFAS)"
source = "open_meteo_glofas"
variable = "river_discharge"
lat = -30.075
lon = -51.325

[[station]]
id = "GLOFAS-JACUI"
