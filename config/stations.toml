# --- Open-Meteo Flood API (GloFAS): vazão diária modelada (m³/s) -------------
# Coordenadas = centro da célula devolvido pela API, escolhido como a célula de
# maior vazão numa vizinhança de ±0,1° (a célula de ~5 km pode cair fora do rio).
[[station]]
id = "GLOFAS-GUAIBA"
name = "Guaíba em Porto Alegre (GloFAS)"
source = "open_meteo_glofas"
variable = "river_discharge"
lat = -30.075
lon = -51.325

