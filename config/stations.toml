# Stations and grid points monitored in the Guaíba basin.
# `id` is the station_id written in each Reading and in the on-chain Station account.

# --- INMET: hourly rain (mm), automatic stations -------------------------------
[[station]]
id = "A801"
name = "Porto Alegre - Jardim Botânico"
source = "inmet"
variable = "precipitation"
lat = -30.05361111
lon = -51.17472221

