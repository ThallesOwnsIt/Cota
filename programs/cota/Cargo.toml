[package]
name = "cota"
version = "0.1.0"
description = "Programa on-chain do Cota: comitê de oráculos, estações e lotes ancorados"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "cota"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = ["solana-v4"] }
solana-instructions-sysvar = "4.0"
solana-sdk-ids = "3.1"

[dev-dependencies]
cota-core = { path = "../../crates/cota-core" }
litesvm = { version = "0.18.1", features = ["precompiles"] }
ed25519-dalek = "2"
solana-message = "4.2"
solana-transaction = "4.1"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
