[package]
name = "cota-v2"
version = "0.2.0"
description = "Cota on-chain program v2: oracle committee and one append-only accumulator (MMR) for every record"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "cota_v2"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = ["solana-v4"] }
solana-instructions-sysvar = "4.0"
solana-sdk-ids = "3.1"
solana-sha256-hasher = "3"

[dev-dependencies]
cota-core = { path = "../../crates/cota-core" }
litesvm = { version = "0.18.1", features = ["precompiles"] }
ed25519-dalek = "2"
solana-message = "4.2"
solana-transaction = "4.1"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
base64 = "0.22"
borsh = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
