# Cota live mode, every 30 minutes:
#   - 3 node jobs, one per key (each one only sees its own secret): they check INMET's
#     warnings and, if there is a closed UTC day not yet anchored, sign its batch and the
#     rain forecast for the next 5 days (that day's 00Z run, Open-Meteo);
#   - 1 aggregator: takes to the chain whatever has ≥ 2 of 3 signatures (the program applies the
#     early-warning rule to the forecast rain), forecasts discharge, audits and commits
#     the ledger and the dashboard data (Vercel redeploys on every push); cranks the parametric
#     vaults when there are new triggers.
#
# Secrets: NODE_1_KEY, NODE_2_KEY, NODE_3_KEY and OPERATOR_KEY (contents of the JSON keypairs);
#          ANA_IDENTIFICADOR and ANA_SENHA (HidroWebService login, river level from gauges).
# Safety switch: only runs with the repository variable COTA_LIVE_ENABLED = true (turn it on after
# setting up the secrets and handing the committee authority to the operator).
name: Cota ao vivo

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: cota-live
  cancel-in-progress: false

permissions:
  contents: write

env:
  RPC: https://api.devnet.solana.com
  CLUSTER: devnet
  CARGO_TERM_COLOR: never

jobs:
  plan:
    if: vars.COTA_LIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      day: ${{ steps.next.outputs.day }}
    steps:
      - uses: actions/checkout@v4
      - id: next
        run: echo "day=$(python3 scripts/next_day.py)" >> "$GITHUB_OUTPUT"

  node:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cota
      - run: cargo build --release -p cota-oracle --bin cota-node --bin cota-alerts --bin cota-outlook
      - name: Chave do nó
        env:
          KEY: ${{ secrets[format('NODE_{0}_KEY', matrix.node)] }}
        run: |
          umask 077
          mkdir -p keys && printf '%s' "$KEY" > keys/node.json
      - name: Avisos do INMET
        run: target/release/cota-alerts observe --key keys/node.json --out out/alerts
      - name: Lote de ${{ needs.plan.outputs.day }}
        if: needs.plan.outputs.day != ''
        env:
          ANA_IDENTIFICADOR: ${{ secrets.ANA_IDENTIFICADOR }}
          ANA_SENHA: ${{ secrets.ANA_SENHA }}
        run: >
          target/release/cota-node --key keys/node.json --day "${{ needs.plan.outputs.day }}"
          --rpc "$RPC" --config config/stations-live.toml --out out
      - name: Chuva prevista após ${{ needs.plan.outputs.day }}
        if: needs.plan.outputs.day != ''
        # Without the forecast, the node's batch still counts.
        continue-on-error: true
        run: target/release/cota-outlook observe --key keys/node.json --day "${{ needs.plan.outputs.day }}" --out out/outlook
      - run: rm -f keys/node.json
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.node }}
          path: out/
          retention-days: 3
          if-no-files-found: ignore

  aggregate:
    needs: [plan, node]
    # One node being down must not stop the system: the 2-of-3 threshold decides.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cota
      - run: cargo build --release -p cota-oracle --bins
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project ml
      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: data/nodes
      - name: Chave do operador
        env:
          KEY: ${{ secrets.OPERATOR_KEY }}
        run: |
          umask 077
          mkdir -p keys && printf '%s' "$KEY" > keys/operator.json
      - name: Avisos oficiais com quórum
        run: target/release/cota-alerts anchor --rpc "$RPC" --cluster "$CLUSTER" --payer keys/operator.json
      - name: Lote, qualidade, previsão e alerta de ${{ needs.plan.outputs.day }}
        if: needs.plan.outputs.day != ''
        run: |
          day="${{ needs.plan.outputs.day }}"
          target/release/cota-aggregator --rpc "$RPC" --cluster "$CLUSTER" --payer keys/operator.json \
            --config config/stations-live.toml
          target/release/cota-outlook anchor --rpc "$RPC" --cluster "$CLUSTER" --payer keys/operator.json || true
          (cd ml && uv run python -m cota_ml.forecast --day "$day")
          if [[ -f "data/forecasts/$day.json" ]]; then
            target/release/cota-admin --rpc "$RPC" --payer keys/operator.json \
              commit-forecast --file "data/forecasts/$day.json" --cluster "$CLUSTER"
          fi
      # Parametric vaults: the program decides; the operator only pays the crank's fee.
      - name: Cofres
        continue-on-error: true
        run: target/release/cota-vault --rpc "$RPC" --cluster "$CLUSTER" --payer keys/operator.json crank
      - run: rm -f keys/operator.json
        if: always()
      # These run even if the batch fails: an official warning already anchored must not go
      # unrecorded.
      - name: Auditoria e dados do dashboard
        if: always()
        run: |
          if [[ -z "$(git status --porcelain data/ledger)" ]]; then
            echo "nada novo no ledger"
            exit 0
          fi
          target/release/cota-audit --rpc "$RPC"
          python3 scripts/export_dashboard.py
      - name: Commit
        if: always()
        run: |
          git add data/ledger dashboard/data
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "cota-bot"
          git config user.email "cota-bot@users.noreply.github.com"
          git commit -q -m "ao vivo: $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
