# Cota live mode, every 30 minutes. Every step is scripts/live/round.sh, the same round the server runs:
#   - plan: the closed UTC day the chain is waiting a batch for (if any), decided once for the whole run;
#   - 3 node jobs, one per key (each one only sees its own secret): INMET's warnings, the day's batch and the rain
#     forecast for the next 5 days, each signed by the node;
#   - 1 aggregator: takes to the chain whatever has ≥ 2 of 3 signatures (the program applies the early-warning rule
#     to the forecast rain), forecasts discharge, cranks the parametric vaults, stamps the accumulator's root in
#     Bitcoin, audits, copies the new ledger files to Arweave and commits the ledger and the dashboard data.
#
# Secrets: NODE_1_KEY, NODE_2_KEY, NODE_3_KEY and OPERATOR_KEY (contents of the JSON keypairs);
#          ANA_IDENTIFICADOR and ANA_SENHA (HidroWebService login, river level from gauges);
#          ARCHIVE_KEY (keys/archive.json: signs the free Arweave uploads, holds no balance);
#          RPC_URL (optional: a dedicated devnet RPC endpoint);
#          VERCEL_DEPLOY_HOOK (optional: rebuilds the site after each push).
# Safety switch: only runs with the repository variable COTA_LIVE_ENABLED = true. With COTA_BACKUP_MODE = true the
# server (docs/server.md) is the primary and this workflow only acts when the server falls behind.
name: Cota ao vivo

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: cota-live
  cancel-in-progress: false

permissions:
  contents: write

env:
  # A dedicated RPC (e.g. Helius' free plan) in the RPC_URL secret, if set; the public devnet RPC otherwise,
  # which throttles bursts (the tools retry on 429). The dashboard always reads the public one.
  RPC: ${{ secrets.RPC_URL || 'https://api.devnet.solana.com' }}
  CLUSTER: devnet
  CARGO_TERM_COLOR: never

jobs:
  plan:
    if: vars.COTA_LIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      day: ${{ steps.next.outputs.day }}
      run: ${{ steps.next.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: next
        env:
          BACKUP: ${{ vars.COTA_BACKUP_MODE == 'true' && github.event_name == 'schedule' }}
        run: |
          day=$(scripts/live/round.sh plan)
          run=true
          # Backup mode (repository variable COTA_BACKUP_MODE = true): the server runs the rounds, and GitHub only
          # steps in when a closed day is still not anchored at 03:00 UTC (the server does it soon after 01:00).
          # A manual run (workflow_dispatch) always runs.
          if [[ $BACKUP == true ]] && { [[ -z $day ]] || (( 10#$(date -u +%H) < 3 )); }; then
            run=false
            echo "modo reserva: o servidor está em dia; nada a fazer"
          fi
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  node:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cota
      - run: cargo build --release -p cota-oracle --bin cota-node --bin cota-alerts --bin cota-outlook
      - name: Chave do nó
        env:
          KEY: ${{ secrets[format('NODE_{0}_KEY', matrix.node)] }}
        run: |
          umask 077
          mkdir -p keys && printf '%s' "$KEY" > keys/node.json
      - name: Nó ${{ matrix.node }} (dia ${{ needs.plan.outputs.day || 'nenhum' }})
        env:
          DAY: ${{ needs.plan.outputs.day }}
          KEY: keys/node.json
          OUT: data/nodes/node-${{ matrix.node }}
          ANA_IDENTIFICADOR: ${{ secrets.ANA_IDENTIFICADOR }}
          ANA_SENHA: ${{ secrets.ANA_SENHA }}
        run: scripts/live/round.sh node
      - run: rm -f keys/node.json
        if: always()
      # Even if the batch failed, the warnings this node signed still count.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-${{ matrix.node }}
          path: data/nodes/node-${{ matrix.node }}/
          retention-days: 3
          if-no-files-found: ignore

  aggregate:
    needs: [plan, node]
    # One node being down must not stop the system: the 2-of-3 threshold decides.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cota
      - run: cargo build --release -p cota-oracle --bins
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project ml
      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: data/nodes
      - name: Chave do operador
        env:
          KEY: ${{ secrets.OPERATOR_KEY }}
        run: |
          umask 077
          mkdir -p keys && printf '%s' "$KEY" > keys/operator.json
      - name: Cadeia, previsão, cofres, carimbo, auditoria, cópia permanente e commit
        env:
          DAY: ${{ needs.plan.outputs.day }}
          PAYER: keys/operator.json
          PUSH: "1"
          ARCHIVE_KEY: ${{ secrets.ARCHIVE_KEY }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: scripts/live/round.sh aggregate
      - run: rm -f keys/operator.json
        if: always()
